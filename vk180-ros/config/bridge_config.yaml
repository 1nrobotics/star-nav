# eCAL ROS Bridge Configuration

# Frame IDs
odom_frame_id: "odom"
base_frame_id: "base_link"  
camera_frame_id: "camera_link"

# eCAL Topics
ecal_odom_topic: "S1/vio_odom"
ecal_disparity_topic: "S1/stereo1_l/disparity"

# Transform Publishing
publish_tf: true

# Planner Integration
publish_to_planner: true

# Alternative eCAL topics (uncomment to use)
# ecal_odom_topic: "S0/vio_odom"
# ecal_disparity_topic: "S0/stereo1_l/disparity"

# VK180 Camera Calibration (from your camera_info)
# These parameters will be used by the planner for depth projection
# fx: 198.603
# fy: 198.603  
# cx: 315.758
# cy: 189.992
# baseline: 0.0777  # meters (calculated from P[3])