version: '3.8'

services:
  # Main navigation service - runs all packages (px4ctrl, shiviz_px4_nav, utils)
  star_nav:
    build: 
      context: .
      dockerfile: Dockerfile
    image: 1nrobotics/star-nav:${IMAGE_TAG:-local}
    container_name: star_nav
    hostname: star_nav
    network_mode: "host"
    privileged: true
    volumes:
      # Mount all source packages for development
      - ./px4ctrl:/catkin_ws/src/px4ctrl:rw
      - ./shiviz_px4_nav:/catkin_ws/src/shiviz_px4_nav:rw
      - ./utils:/catkin_ws/src/utils:rw
      # Mount for logs and data
      - ./logs:/catkin_ws/logs:rw
      # Mount for PX4 communication (if using serial)
      - /dev:/dev:rw
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost  
      - ROS_IP=localhost
      - PX4_SIM_HOST=localhost
      - PX4_SIM_MODEL=iris
      - VEHICLE_ID=1
      - DISPLAY=${DISPLAY}
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: >
      bash -c "source /catkin_ws/devel/setup.bash && 
               roslaunch shiviz_px4_nav px4_offboard.launch"

  # PX4 Controller service - runs px4ctrl specifically
  px4ctrl:
    extends: star_nav
    container_name: px4ctrl
    hostname: px4ctrl
    command: >
      bash -c "source /catkin_ws/devel/setup.bash && 
               roslaunch px4ctrl run_ctrl.launch"
    profiles:
      - px4ctrl

  # PX4 SITL simulation (optional - for development)
  px4_sitl:
    image: px4io/px4-dev-simulation-focal:latest
    container_name: px4_sitl
    hostname: px4_sitl
    network_mode: "host"
    privileged: true
    volumes:
      - px4_data:/tmp
    environment:
      - DISPLAY=${DISPLAY}
      - PX4_SIM_MODEL=iris
      - PX4_SIM_WORLD=empty
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: >
      bash -c "cd /home/user/Firmware && 
               make px4_sitl gazebo"
    profiles:
      - simulation

  # Ground Control Station (MAVProxy)
  mavproxy:
    image: ardupilot/ardupilot-dev-base:latest
    container_name: mavproxy
    network_mode: "host"
    volumes:
      - mavproxy_logs:/logs
    environment:
      - MAVLINK_DIALECT=common
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: >
      bash -c "mavproxy.py --master=udp:localhost:14540 --out=udp:localhost:14550"
    profiles:
      - gcs

  # Development environment with GUI support
  star_nav_dev:
    extends: star_nav
    container_name: star_nav_dev
    image: 1nrobotics/star-nav:${IMAGE_TAG:-local}
    volumes:
      # Mount entire workspace for development
      - .:/catkin_ws/src:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
    command: bash
    profiles:
      - development

  # RViz visualization
  rviz:
    extends: star_nav
    container_name: rviz
    hostname: rviz
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./utils/rviz_plugins/config:/root/.rviz:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    command: >
      bash -c "source /catkin_ws/devel/setup.bash && 
               rosrun rviz rviz"
    profiles:
      - visualization

volumes:
  px4_data:
  mavproxy_logs:

networks:
  default:
    name: star_nav_network
