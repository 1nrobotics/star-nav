# The Lite3 as the planner's side needs to know it: lengths in m,
# max_speed in m/s, max_turn in rad/s, lidar_mount in the body frame.
# The launch files load it as /robot, and
# star_nav_bringup/test/test_planner_interface.py checks what they give the
# planner against it.
#
# Written from mujoco_sim/star_nav_mujoco/robots/lite3.py: do not edit.
# Change the robot there, then (mujoco_sim/tests/test_robots.py checks it):
#   mujoco_sim/.venv/bin/python -m star_nav_mujoco --describe lite3 \
#     > star_nav_bringup/config/robots/lite3.yaml
name: lite3
type: legged
length: 0.61
width: 0.39
height: 0.44
lidar_mount: [0.0, 0.0, 0.1]
stand_height: 0.34
max_speed: 0.8
max_turn: 0.8
