# The Quadrotor as the planner's side needs to know it: lengths in m,
# lidar_mount in the body frame.
# The launch files load it as /robot, and
# star_nav_bringup/test/test_planner_interface.py checks what they give the
# planner against it.
#
# Written from mujoco_sim/star_nav_mujoco/robots/quadrotor.py: do not edit.
# Change the robot there, then (mujoco_sim/tests/test_robots.py checks it):
#   mujoco_sim/.venv/bin/python -m star_nav_mujoco --describe quadrotor \
#     > star_nav_bringup/config/robots/quadrotor.yaml
name: quadrotor
type: aerial
length: 0.37
width: 0.37
height: 0.1
lidar_mount: [0.0, 0.0, 0.06]
