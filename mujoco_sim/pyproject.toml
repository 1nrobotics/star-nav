[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "star-nav-mujoco"
version = "0.1.0"
description = "Standalone MuJoCo quadrotor simulator for the Star Nav planning stack"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mujoco==4.0.1",
  "numpy>=1.26",
  "pyzmq>=25",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
star-nav-mujoco = "star_nav_mujoco.__main__:main"

[tool.setuptools]
packages = ["star_nav_mujoco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
