name: sim-smoke

# Not triggered by pushes or pull requests: the tests are run on the
# contributor's machine before pushing (./scripts/run_local_tests.sh, see
# CONTRIBUTING.md). This workflow runs the Docker variants of the quadrotor
# tests and can be started by hand from the Actions tab.
on:
  workflow_dispatch:

# A new run on a branch cancels its run still in progress.
concurrency:
  group: sim-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      - name: Build image
        run: docker compose build test

      - name: Run planner unit tests
        run: >
          docker compose run --rm test bash -c
          "cd /catkin_ws && source devel/setup.bash &&
          catkin_make run_tests_plan_env &&
          catkin_test_results build/test_results/plan_env"

      - name: Run headless exploration smoke test
        run: docker compose run --rm test

  mujoco-unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6

      - name: Install simulator
        run: pip install "./mujoco_sim[test]"

      - name: Run simulator tests
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python -m pytest mujoco_sim/tests -v

  mujoco-smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sensor: [depth, lidar]
    name: mujoco-smoke-test (${{ matrix.sensor }})
    steps:
      - uses: actions/checkout@v4

      - name: Run headless MuJoCo exploration smoke test
        env:
          SENSOR: ${{ matrix.sensor }}
        run: ./scripts/run_mujoco_smoke_test.sh
