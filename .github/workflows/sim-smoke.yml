name: sim-smoke

# Runs automatically only on pull requests into main that change code, and
# not while they are drafts (marking one ready runs it). main itself only
# receives tested pull requests, so pushes to it do not run it again; run it
# by hand from the Actions tab when needed.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'docs/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: sim-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      - name: Build image
        run: docker compose build test

      - name: Run planner unit tests
        run: >
          docker compose run --rm test bash -c
          "cd /catkin_ws && source devel/setup.bash &&
          catkin_make run_tests_plan_env &&
          catkin_test_results build/test_results/plan_env"

      - name: Run headless exploration smoke test
        run: docker compose run --rm test

  mujoco-unit-tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6

      - name: Install simulator
        run: pip install "./mujoco_sim[test]"

      - name: Run simulator tests
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python -m pytest mujoco_sim/tests -v

  mujoco-smoke-test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sensor: [depth, lidar]
    name: mujoco-smoke-test (${{ matrix.sensor }})
    steps:
      - uses: actions/checkout@v4

      - name: Run headless MuJoCo exploration smoke test
        env:
          SENSOR: ${{ matrix.sensor }}
        run: ./scripts/run_mujoco_smoke_test.sh
