name: Feature request
description: Suggest an improvement to the simulation, planner or tooling
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Hardware-specific integrations belong on a hardware/* branch (docs/HARDWARE.md).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
